<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="FOMO Firewall — Pulse Shield">
  <title>FOMO Firewall — Pulse Shield</title>
  <defs>
